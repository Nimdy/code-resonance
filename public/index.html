<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Code Resonance</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/score.js" defer></script>
  <script src="/music.js" defer></script>
  <script src="/recording.js" defer></script>
  <script src="/app.js" defer></script>
  <script type="module" src="/ui/main.js"></script>
</head>
<body>
  <!-- The interface (public/ui/main.js) builds the Control Center and the Stage around the stage layer below. -->
  <div id="app" class="app" hidden></div>
  <!-- The stage: one engine's canvases, positioned over whichever view shows it (Stage, Visual Studio, Home …). -->
  <div id="stageHost" class="stage-host" aria-label="Performance stage">
    <div class="canvas-wrap">
      <canvas id="stage" aria-label="Animated representation of software architecture and musical energy"></canvas>
      <canvas id="construct" class="hidden" aria-label="The Construct: the software as an illuminated architectural model being built"></canvas>
      <canvas id="world" class="hidden" aria-label="The project's living world, generated from its code and its development"></canvas>
      <canvas id="worldOverlay" class="hidden" aria-hidden="true"></canvas>
      <div class="caption" id="caption" aria-live="polite"></div>
      <div class="stage-empty" id="stageEmpty"><div class="empty-orbit"></div><span>Waiting for a project</span></div>
    </div>
  </div>
  <!-- Controls drawn over the stage by the view that shows it (transport, preview badge …); never part of recordings. -->
  <div id="stageChrome" class="stage-chrome parked"></div>
  <noscript>Code Resonance needs JavaScript.</noscript>
</body>
</html>
