name: extended-qualification
# The expensive tier, not required on every push: it costs about 4 runner-hours (Windows minutes count double).
# Runs when a pull request gets the label `extended-qualification` (every job), or `extended:<job>` for one job (e.g.
# `extended:obs`, to re-run just that one after a fix). It starts when the label is added: after new pushes, remove
# the label and add it again. Also weekly on main and by hand on main.
#   packs-full       each reference pack through the full compatibility tests (90 s idle, determinism, 4 switches, 1080p)
#   runtime-full     the full robustness suite (context loss, hostile probe and flood, revocation, modified files,
#                    navigation, hidden tab, film timeout) and live recording (lifecycle, a 3-minute recording)
#   history          long-history reconstruction up to 1,000,000 intents
#   soak             one hour of the live player with sound, worlds, packs, idle, recordings and a receiver restart
#   windows-browser  native Windows: Chromium Stage, a reference pack, quick recording
#   windows-vscode   native Windows: the extension in a real VS Code
#   obs              OBS Studio itself, in the disposable runner (installed from the official PPA, Xvfb, software GL)
#   ui-full          the whole interface qualification: every workspace suite and the multi-window acceptance scenarios
# Linux runs on ubuntu-24.04, the image every qualification ran on, not ubuntu-latest: move it in its own pull request.
on:
  pull_request:
    types: [labeled]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
# One run per pull request: a newer label replaces the run in progress (several labels added at once would otherwise
# start one run each).
concurrency:
  group: extended-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  packs-full:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'extended-qualification') || contains(github.event.pull_request.labels.*.name, 'extended:packs-full')
    runs-on: ubuntu-24.04
    # Phase 5: the declarative pack 43–53 min, the shader pack 27–34 min. The shader pack's quick suite has taken about
    # 25 min since Phase 7 (3.5–7 min before), so its full suite may need about 2 h.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        pack: [ember-observatory, blueprint-cathedral, cymatic-field]
    defaults:
      run:
        working-directory: qualification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node ../scripts/pack.js test ../packs/examples/${{ matrix.pack }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pack-full-${{ matrix.pack }}
          path: qualification/results/visual/pack-*.json
  runtime-full:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'extended-qualification') || contains(github.event.pull_request.labels.*.name, 'extended:runtime-full')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: qualification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node visual/robustness.qual.js
      # The software renderer cannot meet real-hardware frame rates: mechanism thresholds, a fixed lower rendering level.
      - run: node visual/recording.qual.js --mechanism --quality 3 --long 120 --size stage --viewport 800x560
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-full
          path: |
            qualification/results/robustness
            qualification/results/recording/*.json
            qualification/results/recording/*.jpg
  history:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'extended-qualification') || contains(github.event.pull_request.labels.*.name, 'extended:history')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: qualification
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node visual/history.qual.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history
          path: qualification/results/visual/history-qualification.json
  ui-full:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'extended-qualification') || contains(github.event.pull_request.labels.*.name, 'extended:ui-full')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: qualification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node ui/run-all.js --jobs 1
        env:
          CR_UI_QUALITY: '3'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-full
          path: qualification/results/ui
  soak:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'extended-qualification') || contains(github.event.pull_request.labels.*.name, 'extended:soak')
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    defaults:
      run:
        working-directory: qualification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      # Software rendering: a fixed lower level at 1280x720 (at 1080p the shader pack falls under the watchdog's 1 fps floor).
      - run: node visual/soak.qual.js --hours 1 --viewport 1280x720 --quality 3 --mechanism --record-size stage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak
          path: qualification/results/soak
  windows-browser:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'extended-qualification') || contains(github.event.pull_request.labels.*.name, 'extended:windows-browser')
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: qualification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright-core install chromium
      - run: node browser/stage.qual.js
      - run: node ../scripts/pack.js test ../packs/examples/cymatic-field --quick
      - run: node visual/recording.qual.js --quick --quality 3 --size stage --viewport 800x560
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-browser
          path: |
            qualification/results/browser
            qualification/results/visual/pack-*.json
            qualification/results/recording/*.json
  windows-vscode:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'extended-qualification') || contains(github.event.pull_request.labels.*.name, 'extended:windows-vscode')
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: qualification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node vscode/run.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-vscode
          path: qualification/results
  obs:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'extended-qualification') || contains(github.event.pull_request.labels.*.name, 'extended:obs')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: qualification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install OBS Studio (official PPA) in this disposable runner
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y obs-studio xvfb
          # Ubuntu 24.04 restricts unprivileged user namespaces, which the Chromium inside OBS's browser source needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" node obs/obs.qual.js
      # The preview worlds in OBS, measured (not gating): this runner renders in software, and a raymarched or
      # depth-of-field world is far slower there than on a GPU (their GPU figures are in docs/QUALIFICATION.md).
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" node obs/obs.qual.js --family fractal-continuum --seconds 30 --out results/obs/fractal-continuum
        if: always()
        continue-on-error: true
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" node obs/obs.qual.js --family synaptic-storm --seconds 30 --out results/obs/synaptic-storm
        if: always()
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obs
          path: qualification/results/obs
