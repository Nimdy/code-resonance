name: pages
# The web demo on GitHub Pages (https://nimdy.github.io/code-resonance/): `npm run site` builds it from the player
# (public/) and the public recording qualification/recordings/lumen-recipes (Node only, no dependencies), and the
# result is deployed as the Pages site. On pushes to main that change what the site is built from, and by hand.
# Never on pull requests: nothing from a fork runs with the Pages permissions. Before the first run, the repository's
# owner sets Settings > Pages > Source: GitHub Actions (once). docs/WEB-DEMO.md describes the site.
# Linux runs on ubuntu-24.04, the image every qualification ran on, not ubuntu-latest: move it in its own pull request.
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'engine/**'
      - 'receiver/**'
      - 'scripts/build-site.js'
      - 'qualification/recordings/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
# One deployment at a time; a deployment in progress is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # Forks that enable Actions do not try to publish a site of their own.
    if: github.repository == 'Nimdy/code-resonance'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
