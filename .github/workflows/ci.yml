name: validation
# On pull requests and on pushes to main, one run per commit (a branch push no longer runs it a second time): syntax,
# the unit and integration suite (npm test), the VSIX package. A change that touches only documentation (Markdown,
# docs/, LICENSE) runs nothing: `npm test` checks its links locally (tests/docs.test.js).
# Native Windows runs on pull requests and on main only (Windows runner minutes count double): the same suite plus the
# platform smoke test (the receiver as a real process, paths with spaces, the token, a restart, the pack CLI and
# integrity). No test is retried: a failure fails the run.
# The suite runs in three shards per platform (`node --test --test-shard=i/3`, every third test file), in parallel: on a
# two-core runner the whole suite took 9-10 minutes, most of it a few long digital-life simulations. The syntax check,
# the package and the smoke test run once, in shard 1. The test command is `npm test`'s, with the glob quoted so Node
# expands it on every platform. --test-timeout also bounds each test file (a file is a test of the run): 300 s, since
# Windows runners take three to four times as long as a desktop for the digital-life simulations (one 15-22 s test took
# 53-70 s there, and a file of two of them passed 120 s).
# Linux runs on ubuntu-24.04, the image every qualification ran on, not ubuntu-latest: move it in its own pull request.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
# A newer push to the same pull request (or to main) replaces the run in progress.
concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  node:
    name: node (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: matrix.shard == 1
        run: npm run check
      - run: node --test --test-timeout=300000 --test-shard=${{ matrix.shard }}/3 "tests/*.test.js"
      - if: matrix.shard == 1
        run: npm run package:vsix
      - if: matrix.shard == 1
        run: node qualification/platform/smoke.js
  windows:
    name: windows (${{ matrix.shard }}/3)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: matrix.shard == 1
        run: npm run check
      - run: node --test --test-timeout=300000 --test-shard=${{ matrix.shard }}/3 "tests/*.test.js"
      - if: matrix.shard == 1
        run: npm run package:vsix
      - if: matrix.shard == 1
        run: node qualification/platform/smoke.js
      - uses: actions/upload-artifact@v4
        if: always() && matrix.shard == 1
        with:
          name: windows-validation
          path: qualification/results/platform
