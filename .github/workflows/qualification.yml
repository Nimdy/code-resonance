name: qualification
# Required, on every pull request: real-environment checks in headless Chromium (software rendering: SwiftShader) and
# a real VS Code extension host under Xvfb.
#   browser   the Stage and the audio engine
#   packs     each reference visual pack (declarative, shader, world) through the compatibility tests, quick mode
#   runtime   the pack runtime's robustness (slow, hanging and failing test fixtures; quick mode) and live recording
#             of the four renderer categories (real WebM files measured with ffmpeg; quick mode)
#   ui        the Control Center and Stage: the workspace suites that run within a two-core runner without a GPU, and
#             the single-window acceptance scenarios (the full interface qualification is in extended.yml: ui-full)
#   vscode    the extension in a real VS Code
# The rendering suites run at quality 3 (CR_QUALITY, CR_UI_QUALITY): what a user of a machine without a GPU would
# choose; the flagship worlds at full quality need a GPU (measured on one in the render lab and the extended tier).
# The expensive tier (full pack suites, long recordings, soak, native Windows browser and VS Code, OBS) is in
# extended.yml. The real-agent scenario (CR_QUAL_AGENT=claude) needs credentials and is run manually, not here.
on:
  workflow_dispatch:
  pull_request:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: qualification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node browser/stage.qual.js
        env:
          CR_QUALITY: '3'
      - run: node browser/audio.qual.js
        env:
          CR_AUDIO_SECONDS: '60'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qualification
          path: qualification/results
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pack: [ember-observatory, blueprint-cathedral, cymatic-field]
    defaults:
      run:
        working-directory: qualification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node ../scripts/pack.js test ../packs/examples/${{ matrix.pack }} --quick
        env:
          CR_QUALITY: '3'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pack-${{ matrix.pack }}
          path: qualification/results/visual/pack-*.json
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: qualification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node visual/robustness.qual.js --quick
        env:
          CR_QUALITY: '3'
      # A fixed lower rendering level and the stage's size, so the software renderer presents enough frames for the
      # recording to be measured (720p and 1080p are qualified on a GPU; quick mode adds a world pack at 720p). Since 0.5
      # the Stage fills the window: an 800x560 window keeps the stage area this job measured before (about 745x575).
      - run: node visual/recording.qual.js --quick --quality 3 --size stage --viewport 800x560
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-qualification
          path: |
            qualification/results/robustness
            qualification/results/recording
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: qualification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      # One suite at a time, rendering at the Lowest quality as a user of a 2-core machine without a GPU would choose.
      # The studios that render WebGL continuously (Visual, Music, Output) and the scenarios with three windows rendering
      # at once starve these runners (measured: clicks time out, screenshots fail); they run in extended.yml (ui-full).
      - run: node ui/run-all.js --jobs 1 --quick --only connections,home,packs,projects,settings,acceptance
        env:
          CR_UI_QUALITY: '3'
          CR_UI_SINGLE_WINDOW: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-qualification
          path: qualification/results/ui
  vscode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: qualification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm ci
      - run: xvfb-run -a -s "-screen 0 1600x1000x24" node vscode/run.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vscode-qualification
          path: qualification/results
